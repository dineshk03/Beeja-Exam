version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: exam-mongodb-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ExamSystem2024!
      MONGO_INITDB_DATABASE: exam-module
    ports:
      - "127.0.0.1:27017:27017"  # Bind to localhost only for security
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - exam-network
    command: mongod --auth

  # Exam Application
  exam-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-app-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:ExamSystem2024!@mongodb:27017/exam-module?authSource=admin
      - JWT_SECRET=ExamSystem2024SuperSecretJWTKey!ChangeThis
    ports:
      - "127.0.0.1:5000:5000"  # Bind to localhost only, Nginx will proxy
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: exam-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - exam-app
    networks:
      - exam-network

volumes:
  mongodb_data:
    driver: local

networks:
  exam-network:
    driver: bridge
